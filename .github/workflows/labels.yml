name: labels

on:
  push:
    branches:
      - "main"
    paths:
      - ".github/labels.yml"
      - ".github/workflows/labels.yml"

permissions:
  contents: read
  issues: write
  packages: read

jobs:
  labeler:
    runs-on: acmapp-k8s
    container:
      image: ghcr.io/acm-uic/iac-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v3
      - name: Run Labeler 🏷
        uses: crazy-max/ghaction-github-labeler@v4
