name: Kube Lint

on:
  pull_request:
    paths:
      - "kubernetes/**/*.yml"
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  lint:
    runs-on: acmapp-k8s
    container:
      image: ghcr.io/acm-uic/iac-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Scan yamls
        uses: stackrox/kube-linter-action@v1
        with:
          directory: ./kubernetes
          config: ./.github/kubelintcfg.yml
