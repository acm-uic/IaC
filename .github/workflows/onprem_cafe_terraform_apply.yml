---
name: 'Tofu Apply for Maid Café'
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read

concurrency:
  group: maid-cafe-terraform-prod
  cancel-in-progress: false

jobs:
  tofu:
    name: 'Tofu Apply'
    runs-on: acmapp-builder
    strategy:
      matrix:
        stack: [maid-cafe-k8s]
    container:
      image: ghcr.io/acm-uic/iac-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
      ARM_USE_OIDC: true
      TF_VAR_proxmox_api_token_id: ${{ secrets.PM_CAFE_API_TOKEN_ID }}
      TF_VAR_proxmox_api_token_secret: ${{ secrets.PM_CAFE_API_TOKEN_SECRET }}
      TF_WORKSPACE: prod
      TF_IN_AUTOMATION: true
      TF_INPUT: 0
    environment: prod
    defaults:
      run:
        shell: bash
        working-directory: proxmox/terraform/stacks/${{ matrix.stack }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v1
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Format and validate
        run: |
          tofu fmt -check -diff -recursive
          tofu init -input=false -no-color
          tofu validate -no-color

      - name: Save reconciliation plan
        run: |
          umask 077
          tofu plan -input=false -json -parallelism=1 \
            -var-file=configuration/prod.tfvars \
            -out="$RUNNER_TEMP/maid-cafe.tfplan"
          tofu show -json "$RUNNER_TEMP/maid-cafe.tfplan" > "$RUNNER_TEMP/maid-cafe.tfplan.json"

      - name: Reject unsafe guest changes
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/check_proxmox_plan.py" \
            "$RUNNER_TEMP/maid-cafe.tfplan.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply the checked saved plan
        run: tofu apply -input=false -no-color "$RUNNER_TEMP/maid-cafe.tfplan"

      # Saved plans include credentials and guest metadata; never publish them.
      - name: Remove private plan files
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/maid-cafe.tfplan" "$RUNNER_TEMP/maid-cafe.tfplan.json"
