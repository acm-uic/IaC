---
name: 'Tofu Plan for Maid Café'
on:
  pull_request:
    paths:
      - '.github/workflows/onprem_cafe_terraform_*.yml'
      - '.github/scripts/*proxmox_plan*'
      - 'proxmox/terraform/stacks/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: write

concurrency:
  group: maid-cafe-terraform-prod
  cancel-in-progress: false

jobs:
  plan-safety-tests:
    # Preserve the existing status-check name for branch protection rules.
    name: Plan safety regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - run: node --test .github/scripts/test_*proxmox_plan.cjs

  tofu:
    name: 'Tofu PR Plan'
    runs-on: acmapp-builder
    strategy:
      matrix:
        stack: [maid-cafe-k8s]
    container:
      image: ghcr.io/acm-uic/iac-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
      ARM_USE_OIDC: true
      TF_VAR_proxmox_api_token_id: ${{ secrets.PM_CAFE_API_TOKEN_ID }}
      TF_VAR_proxmox_api_token_secret: ${{ secrets.PM_CAFE_API_TOKEN_SECRET }}
      TF_WORKSPACE: prod
      TF_IN_AUTOMATION: true
      TF_INPUT: 0

    defaults:
      run:
        shell: bash
        working-directory: proxmox/terraform/stacks/${{ matrix.stack }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v1
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Format and validate
        run: |
          tofu fmt -check -diff -recursive
          tofu init -input=false -no-color
          tofu validate -no-color

      - name: Save reconciliation plan
        run: |
          umask 077
          tofu plan -input=false -no-color -parallelism=1 \
            -var-file=configuration/prod.tfvars \
            -out="$RUNNER_TEMP/maid-cafe.tfplan"
          tofu show -json "$RUNNER_TEMP/maid-cafe.tfplan" > "$RUNNER_TEMP/maid-cafe.tfplan.json"

      - name: Summarize plan actions
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/summarize_proxmox_plan.py" \
            "$RUNNER_TEMP/maid-cafe.tfplan.json" \
            --report "$RUNNER_TEMP/maid-cafe.plan-report.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on planned creations and deletions
        if: github.event_name == 'pull_request'
        # Comment delivery must not become a deployment gate.
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          PLAN_REPORT_PATH: ${{ runner.temp }}/maid-cafe.plan-report.json
          PLAN_STACK: ${{ matrix.stack }}
        with:
          script: |
            const commentPlan = require('./.github/scripts/comment_proxmox_plan.cjs');
            await commentPlan({
              github,
              context,
              reportPath: process.env.PLAN_REPORT_PATH,
              stack: process.env.PLAN_STACK,
            });

      # Saved plans include credentials and guest metadata; never publish them.
      - name: Remove private plan files
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/maid-cafe.tfplan" "$RUNNER_TEMP/maid-cafe.tfplan.json" \
            "$RUNNER_TEMP/maid-cafe.plan-report.json"
