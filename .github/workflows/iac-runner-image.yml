name: IaC runner image

on:
  push:
    branches:
      - main
    paths:
      - images/iac-runner/**
      - .github/workflows/iac-runner-image.yml
  pull_request:
    branches:
      - main
    paths:
      - images/iac-runner/**
      - .github/workflows/iac-runner-image.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  build:
    runs-on: acmapp-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/iac-runner
          push: ${{ github.ref == 'refs/heads/main' }}
          cache-from: type=gha
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=gha,mode=max' || '' }}
          tags: |
            ghcr.io/acm-uic/iac-runner:latest
            ghcr.io/acm-uic/iac-runner:${{ github.sha }}
