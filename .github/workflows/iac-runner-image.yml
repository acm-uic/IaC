name: IaC runner image

on:
  push:
    branches:
      - main
    paths:
      - images/iac-runner/**
      - .github/workflows/iac-runner-image.yml
  pull_request:
    branches:
      - main
    paths:
      - images/iac-runner/**
      - .github/workflows/iac-runner-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: acmapp-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull base image
        id: base
        run: |
          set -euo pipefail
          image=ghcr.io/actions/actions-runner:latest
          for attempt in 1 2 3; do
            if docker pull "$image"; then
              docker image inspect "$image" --format '{{index .RepoDigests 0}}' | tee /dev/stderr
              echo "image=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "pull attempt ${attempt} failed"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/iac-runner
          push: ${{ github.ref == 'refs/heads/main' }}
          build-args: BASE_IMAGE=${{ steps.base.outputs.image }}
          tags: |
            ghcr.io/acm-uic/iac-runner:latest
            ghcr.io/acm-uic/iac-runner:${{ github.sha }}
