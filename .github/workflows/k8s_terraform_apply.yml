---
name: 'Terraform Apply on Kubernetes'
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/k8s_terraform_apply.yml'
      - 'kubernetes/terraform/stacks/acm-member-portal/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read

jobs:
  terraform:
    name: 'Terraform Apply'
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
      ARM_USE_OIDC: true
      TF_WORKSPACE: prod
      TF_IN_AUTOMATION: true
      TF_INPUT: 0
    # Kubernetes-mode pool. This job container is a pod, so Terraform uses in-cluster config.
    runs-on: acmapp-k8s
    container:
      image: ghcr.io/acm-uic/iac-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    environment: prod

    strategy:
      matrix:
        stack:
          - acm-member-portal

    defaults:
      run:
        shell: bash
        working-directory: kubernetes/terraform/stacks/${{ matrix.stack }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure CLI setup
        uses: azure/login@v1
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: 'Terraform Format'
        id: fmt
        run: terraform fmt -check -diff -recursive

      - name: 'Terraform Validate'
        id: validate
        run: |
          terraform init -input=false -backend=false
          terraform validate -no-color

      - name: 'Terraform Apply'
        id: apply
        run: |
          workspace="$TF_WORKSPACE"
          unset TF_WORKSPACE
          terraform init -input=false -reconfigure
          terraform workspace select "$workspace" || terraform workspace new "$workspace"
          terraform apply -input=false -auto-approve -no-color -var-file="configuration/${workspace}.tfvars"
