apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iac
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:acm-uic/IaC.git
    path: kubernetes/argocd/umapyoi/Manifests
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
