# Prerequisites:
# - Configure the Umapyoi API server with:
#   --service-account-issuer=https://k8s-oidc.umapyoi.acmuic.org
# - Create the k8s-oidc-tls secret in this namespace with a certificate for
#   k8s-oidc.umapyoi.acmuic.org before exposing the Gateway publicly.
---
apiVersion: v1
kind: Namespace
metadata:
  name: workload-identity-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oidc-discovery-publisher
  namespace: workload-identity-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oidc-discovery-publisher
rules:
  - nonResourceURLs:
      - /.well-known/openid-configuration
      - /openid/v1/jwks
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-discovery-publisher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oidc-discovery-publisher
subjects:
  - kind: ServiceAccount
    name: oidc-discovery-publisher
    namespace: workload-identity-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oidc-discovery-nginx
  namespace: workload-identity-system
data:
  default.conf: |
    server {
      listen 80;
      listen [::]:80;
      server_name _;
      default_type application/json;

      location / {
        root /usr/share/nginx/html;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oidc-discovery
  namespace: workload-identity-system
  labels:
    app.kubernetes.io/name: oidc-discovery
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: oidc-discovery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oidc-discovery
    spec:
      serviceAccountName: oidc-discovery-publisher
      containers:
        - name: nginx
          image: nginx:1.27.5-alpine
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: discovery-documents
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-configuration
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /.well-known/openid-configuration
              port: http
          livenessProbe:
            httpGet:
              path: /.well-known/openid-configuration
              port: http
      initContainers:
        - name: publish-discovery-documents
          image: bitnami/kubectl:1.32
          command:
            - /bin/sh
            - -ec
          args:
            - |
              mkdir -p /serve/.well-known /serve/openid/v1
              kubectl get --raw '/.well-known/openid-configuration' > /serve/.well-known/openid-configuration
              kubectl get --raw '/openid/v1/jwks' > /serve/openid/v1/jwks
          volumeMounts:
            - name: discovery-documents
              mountPath: /serve
      volumes:
        - name: discovery-documents
          emptyDir: {}
        - name: nginx-configuration
          configMap:
            name: oidc-discovery-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: oidc-discovery
  namespace: workload-identity-system
spec:
  selector:
    app.kubernetes.io/name: oidc-discovery
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: oidc-discovery
  namespace: workload-identity-system
spec:
  gatewayClassName: cilium
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: k8s-oidc.umapyoi.acmuic.org
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: k8s-oidc-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oidc-discovery
  namespace: workload-identity-system
spec:
  parentRefs:
    - name: oidc-discovery
      sectionName: https
  hostnames:
    - k8s-oidc.umapyoi.acmuic.org
  rules:
    - backendRefs:
        - name: oidc-discovery
          port: 80
