apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ceph-csi
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://ceph.github.io/csi-charts
    targetRevision: HEAD
    path: kubernetes/argocd/umapyoi/ceph-csi
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd