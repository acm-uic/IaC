apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-resources
  namespace: argocd
  annotations: 
    argocd.argoproj.io/sync-wave: "-5"  # Mainly to make sure this got synced before everything else
spec:
  destination:
    server: https://kubernetes.default.svc
  source:
    path: kubernetes/argocd/umapyoi/Manifests
    repoURL: git@github.com:acm-uic/IaC.git
    targetRevision: HEAD
    directory:
      recurse: true
  sources: []
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions:
      - ServerSideApply=true
