apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvidia-operator
  namespace: argocd
spec:
  destination:
    namespace: nvidia-gpu-operator
    server: https://kubernetes.default.svc
  sources:
    - repoURL: https://helm.ngc.nvidia.com/nvidia
      chart: gpu-operator
      targetRevision: 26.7.2
      helm:
        valueFiles:
          - $values/kubernetes/argocd/umapyoi/nvidia-operator/values.yaml
    - repoURL: git@github.com:acm-uic/IaC.git
      targetRevision: HEAD
      ref: values
    - repoURL: git@github.com:acm-uic/IaC.git
      targetRevision: HEAD
      path: kubernetes/argocd/umapyoi/nvidia-operator
      directory:
        recurse: true
        include: "*.{yaml,yml}"
        exclude: "values.{yaml,yml}"
  project: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/enforce-version: latest
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/audit-version: latest
        pod-security.kubernetes.io/warn: privileged
        pod-security.kubernetes.io/warn-version: latest