apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
spec:
  destination:
    namespace: external-dns
    server: https://kubernetes.default.svc
  sources:
    - repoURL: https://kubernetes-sigs.github.io/external-dns/
      chart: external-dns
      targetRevision: 1.23.0
      helm:
        valueFiles:
          - $values/kubernetes/argocd/umapyoi/external-dns/values.yaml
    - repoURL: git@github.com:acm-uic/IaC.git
      targetRevision: HEAD
      ref: values
    - repoURL: git@github.com:acm-uic/IaC.git
      targetRevision: HEAD
      path: kubernetes/argocd/umapyoi/external-dns
      directory:
        recurse: true
        include: "*.{yaml,yml}"
        exclude: "values.{yaml,yml}"
  project: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions:
      - CreateNamespace=true
