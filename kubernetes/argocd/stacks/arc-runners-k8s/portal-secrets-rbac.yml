# Job pods on acmapp-k8s run as this namespace's default ServiceAccount.
# Terraform uses that token to write portal-secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: terraform-portal-secrets
  namespace: acm-portal
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: terraform-portal-secrets
  namespace: acm-portal
subjects:
  - kind: ServiceAccount
    name: default
    namespace: arc-runners-k8s
roleRef:
  kind: Role
  name: terraform-portal-secrets
  apiGroup: rbac.authorization.k8s.io
