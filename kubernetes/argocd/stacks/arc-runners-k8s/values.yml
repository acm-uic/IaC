githubConfigUrl: https://github.com/acm-uic
githubConfigSecret: github-arc
runnerScaleSetName: acmapp-k8s
minRunners: 1
maxRunners: 20
containerMode:
  # Job pods use an emptyDir on the node instead of an NFS work claim.
  type: kubernetes-novolume
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller
template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
