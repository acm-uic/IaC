---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-secrets-operator
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: vault-secrets-operator
    server: 'https://kubernetes.default.svc'
  sources:
    - repoURL: 'https://helm.releases.hashicorp.com'
      # Chart 1.x ships a pre-upgrade hook that applies CRDs (Helm itself still will not).
      targetRevision: 1.5.1
      chart: 'vault-secrets-operator'
      helm:
        valueFiles:
          - $values/kubernetes/argocd/stacks/vault-secrets-operator/values.yml
    - path: kubernetes/argocd/stacks/vault-secrets-operator
      repoURL: 'https://github.com/acm-uic/IaC.git'
      targetRevision: HEAD
      ref: values
      directory:
        recurse: true
        include: '*.yml'
        exclude: values.yml
  project: infrastructure
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
