---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stump-the-profs
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: stump-the-profs
    server: "https://kubernetes.default.svc"
  sources:
    - path: kubernetes/argocd/stacks/stump-the-profs
      repoURL: "git@github.com:acm-uic/IaC.git"
      targetRevision: HEAD
      directory:
        recurse: true
        include: "*.yml"
  project: sigweb
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
