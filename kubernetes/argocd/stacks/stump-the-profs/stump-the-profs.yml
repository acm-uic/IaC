# Stump the Profs: a real-time trivia buzzer (Node + Socket.IO).
# App code: https://github.com/acm-uic/Stump-The-Profs-Website
#
# Exactly ONE replica, always: the game state lives in the server's memory, so a second
# pod would be a second, separate game. For the same reason the Deployment uses
# Recreate (stop the old pod, then start the new one) rather than RollingUpdate.
# The game is saved to the volume after every change, so a restart loses nothing.
---
apiVersion: v1
kind: Namespace
metadata:
  name: stump-the-profs
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stump-the-profs
  namespace: stump-the-profs
---
# The admin password comes from Vault: kv-v2 mount "kv", path "stump-the-profs",
# key ADMIN_KEY. It becomes the Secret "stump-secrets" in this namespace.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: stump-the-profs-vault-static-auth
  namespace: stump-the-profs
spec:
  method: kubernetes
  mount: kubernetes
  namespace: stump-the-profs
  kubernetes:
    role: stump-the-profs
    serviceAccount: stump-the-profs
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: stump-secrets
  namespace: stump-the-profs
spec:
  vaultAuthRef: stump-the-profs-vault-static-auth
  type: kv-v2
  mount: kv
  path: stump-the-profs
  destination:
    name: stump-secrets
    create: true
---
# The saved game (state.json) and the uploaded questions (questions.json).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stump-data
  namespace: stump-the-profs
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-right-perms-csi
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stump
  namespace: stump-the-profs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: stump
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stump
    spec:
      serviceAccountName: stump-the-profs
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: stump-data
      containers:
        - name: stump
          # Pinned to one build (the short commit hash from GitHub Actions), so a pod
          # restart always brings back exactly the version that was tested.
          image: ghcr.io/acm-uic/stump-the-profs-website:8636605
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: SAVE_PATH
              value: /app/data/state.json
            - name: QUESTIONS_PATH
              value: /app/data/questions.json
            - name: PUBLIC_URL
              value: https://stumptheprofs.acmuic.org
          envFrom:
            - secretRef:
                name: stump-secrets
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: stump
  namespace: stump-the-profs
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: stump
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: stump-tls
  namespace: stump-the-profs
spec:
  dnsNames:
    - stumptheprofs.acmuic.org
  secretName: stump-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
---
# WebSockets need no special setting: Traefik carries them on this same route.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: stump
  namespace: stump-the-profs
  annotations:
    external-dns.alpha.kubernetes.io/target: app.acmuic.org
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`stumptheprofs.acmuic.org`)
      services:
        - kind: Service
          name: stump
          namespace: stump-the-profs
          passHostHeader: true
          port: 80
          responseForwarding:
            flushInterval: 1ms
          scheme: http
          strategy: RoundRobin
          weight: 10
  tls:
    secretName: stump-tls
