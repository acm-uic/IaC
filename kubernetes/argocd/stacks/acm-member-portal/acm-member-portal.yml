---
apiVersion: v1
kind: Namespace
metadata:
  name: acm-portal
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: portal-tls
  namespace: acm-portal
spec:
  dnsNames:
    - portal.acmuic.org
  secretName: portal-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portal
  namespace: acm-portal
  annotations:
    external-dns.alpha.kubernetes.io/target: app.acmuic.org
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`portal.acmuic.org`)
      services:
        - kind: Service
          name: portal
          namespace: acm-portal
          passHostHeader: true
          port: 80
          responseForwarding:
            flushInterval: 1ms
          scheme: http
          strategy: RoundRobin
          weight: 10
  tls:
    secretName: portal-tls
