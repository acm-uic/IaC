---
image:
  # Follow the latest default-branch build and check GHCR whenever a pod starts.
  tag: latest
  pullPolicy: Always
imagePullSecrets:
  - name: pull-creds
# Matches the numeric runtime user in the portal Dockerfile.
podSecurityContext:
  runAsUser: 10001
  runAsGroup: 10001
database:
  enabled: true
  storage:
    storageClass: nfs-right-perms-csi
