---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    # DinD needs a privileged Docker sidecar. Same PSS exception as nfs and metallb-system.
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
  name: arc-runners
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: runner-defaults
  namespace: arc-runners
spec:
  limits:
    - type: Container
      default:
        cpu: "2"
        memory: 4Gi
      defaultRequest:
        cpu: 250m
        memory: 512Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: arc-runners
  namespace: arc-runners
spec:
  hard:
    pods: "22"
    requests.cpu: "12"
    requests.memory: 40Gi
    limits.cpu: "48"
    limits.memory: 96Gi
