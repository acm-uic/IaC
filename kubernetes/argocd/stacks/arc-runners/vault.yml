---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-vault
  namespace: arc-runners
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: arc-vault-static-auth
  namespace: arc-runners
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  method: kubernetes
  mount: kubernetes
  namespace: arc-runners
  kubernetes:
    role: arc
    serviceAccount: arc-vault
---
# GitHub App keys live in Vault kv/github/arc:
# github_app_id, github_app_installation_id, github_app_private_key
# Create Vault Kubernetes role "arc" bound to SA arc-vault in this namespace
# and in arc-runners-k8s.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: github-arc
  namespace: arc-runners
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: arc-vault-static-auth
  type: kv-v2
  mount: kv
  path: github/arc
  destination:
    name: github-arc
    create: true
