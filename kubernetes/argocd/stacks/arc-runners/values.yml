githubConfigUrl: https://github.com/acm-uic
githubConfigSecret: github-arc
# runs-on: acmapp-builder — DinD pool for docker build / container jobs
runnerScaleSetName: acmapp-builder
minRunners: 1
maxRunners: 20
containerMode:
  type: dind
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller
template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 4Gi
