---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: plausible
  name: smtp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: smtp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smtp
    spec:
      containers:
        - name: smtp
          # Digest of bytemark/smtp:latest (published 2018-07-17). The only other
          # tag, stretch, is a different image, so this pin keeps the current bytes.
          image: bytemark/smtp@sha256:9fd6ff05ac25141fe10ae4f9db0df361ad6139244ac280c398cc175bd2356a98
          ports:
            - containerPort: 25
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"
            requests:
              memory: "64Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  namespace: plausible
  name: smtp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: smtp
  ports:
    - name: smtp
      protocol: TCP
      port: 25
      targetPort: 25
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
